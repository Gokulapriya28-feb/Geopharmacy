<body class="secondpage">
    <h1>Suggesting Medicine</h1>
    <div class="Medicine">
        <button onclick="SuggestMedicine('Fever')" class="symptom">Fever/காய்ச்சல்
            சாதாரண காரணங்கள்:

வைரஸ் தொற்று (சளி, flu)

பாக்டீரியா தொற்று

தொண்டை infection

வயிற்று infection

காயம் / அழற்சி (inflammation)

சில தடுப்பூசி எடுத்த பிறகு
        </button>
       
        <button onclick="SuggestMedicine('Running Nose')"class="symptom">Running Nose/சளி
            முக்கிய காரணங்கள்:

வைரஸ் infection (Common cold virus)

மழை / குளிர் காலநிலை மாற்றம்

குளிர்ந்த தண்ணீர் அல்லது ஐஸ் அதிகம் எடுத்தல்

தூசி, மாசு (dust, pollution)

நோய் எதிர்ப்பு சக்தி குறைவு

சளி உள்ளவர்களுடன் நெருங்கிய தொடர்பு
        </button>
        <button onclick="SuggestMedicine('Dehydration')"class="symptom">Dehydration/நீரிழப்பு
            போதுமான தண்ணீர் குடிக்காதது

அதிக வெயிலில் நீண்ட நேரம் இருப்பது

அதிக வியர்வை

வயிற்றுப்போக்கு அல்லது வாந்தி

காய்ச்சல்

அதிக உடற்பயிற்சி

சர்க்கரை நோய் (அதிக சிறுநீர் கழித்தல்)
        </button>
        
        <button onclick="SuggestMedicine('Headache')"class="symptom">Headache/தலைவலி
            சாதாரண காரணங்கள்:

மன அழுத்தம் (Stress)

தூக்கம் குறைவு

நீரிழப்பு (தண்ணீர் குறைவாக குடிப்பது)

அதிக நேரம் mobile / laptop use

காலியாக வயிறு (சாப்பிடாமல் இருப்பது)

சளி / காய்ச்சல்

கண் பவர் பிரச்சனை
        </button>
        
        <button onclick="SuggestMedicine('Digestion')"class="symptom">Digestion/செரிமானம்
            செரிமானம் ஆகாமல் இருப்பதற்கான காரணங்கள்:

அதிகமாக உணவு சாப்பிடுவது

மிக வேகமாக சாப்பிடுவது

எண்ணெய், காரம் அதிகமான உணவு

நேரம் தவறி உணவு சாப்பிடுதல்

மன அழுத்தம் (Stress)

உடற்பயிற்சி இல்லாமை

போதுமான தண்ணீர் குடிக்காதது
        </button>
        <button onclick="welcometovc()" class="symptom">Others</button>


    </div>
    <div id="result"></div>
</body>

</html>
